# pinned-makefiles.yml — the sha256 of EVERY file make may read in this repository.
#
# scripts/makegate.py is the one way this repository starts make from a script
# or a test (the workflow anchor, the contract-drift shape check, the lane test;
# scripts/scripts_test.go fails on any other make call it matches, in the forms
# AGENTS.md lists). It starts make only when every
# file below is a regular file matching its digest byte for byte, no unpinned
# GNUmakefile/makefile sits beside them, and `make -q <these files>` — which
# runs no ordinary recipe — says none would be REMADE; afterwards it re-hashes them. The
# pinned `make` workflow steps themselves are guarded by the anchor immediately
# before each one. scripts/ci-required-guard.py asserts this file exists, pins
# Makefile, and matches the tree.
#
# Why bytes: reading a Makefile EXECUTES parts of it ($(shell …), $(file …),
# remake rules, secondary expansion …), including during the anchor's own
# `make -pn`. A grammar of make, checked from outside, kept missing constructs
# (vizra-security desk review of PR #5). A digest does not.
#
# CHANGING THIS FILE: a Makefile edit is mergeable only together with a reviewed
# edit here. Regenerate with:  shasum -a 256 Makefile
# Format: `makefiles:` then one "  <path>: <64 lowercase hex>" line per file —
# the same shape vizra-core PR #10 uses. No quotes, tabs or flow style.
# What this does NOT do: judge what a reviewer approves together with a pin
# update. Review is the control there; CODEOWNERS is advisory.

